name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build images
        run: |
          docker compose build api consumer

      - name: Run server tests with coverage (>= 90%)
        run: |
          docker compose run --rm --no-deps api \
            pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Run consumer tests with coverage (>= 90%)
        run: |
          docker compose run --rm --no-deps consumer sh -lc "\
            pip install -q pytest pytest-cov && \
            pytest --cov=app.worker --cov-report=term-missing --cov-fail-under=90 \
          "

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
